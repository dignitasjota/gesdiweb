# Override para probar el contenedor de producción en local.
# Para desarrollo iterativo se usa `cd web && npm run dev` (más rápido).
#
# Uso:
#   RESEND_API_KEY=... docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# El servidor Astro Node corre en el puerto 4321 del contenedor;
# se expone como 8090 en el host para no chocar con el dev server.

services:
  web:
    ports:
      - "8090:4321"
    networks:
      - default
    restart: "no"

networks:
  default:
    driver: bridge
  # Sobrescribimos la red proxy del compose principal para no exigir
  # la red externa de NPM en local.
  proxy:
    external: false
    name: gesdiweb_dev_proxy
