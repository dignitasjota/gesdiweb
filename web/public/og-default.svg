<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="dots" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="rgba(255,255,255,0.18)"/>
    </pattern>
  </defs>

  <!-- Fondo brand -->
  <rect width="1200" height="630" fill="#77c2da"/>

  <!-- Borde brand-hover -->
  <rect x="14" y="14" width="1172" height="602" fill="none" stroke="#5fb3cf" stroke-width="14"/>

  <!-- Patrón de puntos -->
  <rect x="14" y="14" width="1172" height="602" fill="url(#dots)"/>

  <!-- Asterisco decorativo gigante (rotado) -->
  <text
    x="1080"
    y="430"
    font-family="system-ui, -apple-system, sans-serif"
    font-size="500"
    font-weight="700"
    fill="rgba(255,255,255,0.18)"
    text-anchor="middle"
    transform="rotate(15 1080 430)"
  >✳</text>

  <!-- Marker tipo // -->
  <text
    x="80"
    y="120"
    font-family="ui-monospace, monospace"
    font-size="24"
    fill="rgba(255,255,255,0.85)"
    letter-spacing="4"
  >// gesdiweb · 2026</text>

  <!-- Headline -->
  <text
    x="80"
    y="320"
    font-family="system-ui, -apple-system, sans-serif"
    font-size="120"
    font-weight="700"
    fill="#ffffff"
    letter-spacing="-3"
  >gesdiweb<tspan fill="#ffffff" font-weight="700">.</tspan></text>

  <text
    x="80"
    y="430"
    font-family="system-ui, -apple-system, sans-serif"
    font-size="44"
    font-weight="400"
    fill="rgba(255,255,255,0.92)"
  >Diseño web y posicionamiento SEO</text>

  <!-- Footer URL -->
  <text
    x="80"
    y="570"
    font-family="ui-monospace, monospace"
    font-size="22"
    fill="rgba(255,255,255,0.85)"
    letter-spacing="3"
  >gesdiweb.es</text>
</svg>
