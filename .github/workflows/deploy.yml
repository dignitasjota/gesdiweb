name: Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'docker-compose.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/gesdiweb-web

jobs:
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=gesdiweb-web
            org.opencontainers.image.description=gesdiweb · diseño web y posicionamiento SEO
            org.opencontainers.image.vendor=gesdiweb
            org.opencontainers.image.licenses=UNLICENSED

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Trigger Portainer redeploy
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Webhook → Portainer
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          if [ -z "${PORTAINER_WEBHOOK_URL}" ]; then
            echo "::warning::PORTAINER_WEBHOOK_URL no está configurado en secrets — se omite el redeploy automático."
            echo "Para activar el deploy automático, crea la stack en Portainer, copia su webhook y guárdalo como secret PORTAINER_WEBHOOK_URL."
            exit 0
          fi

          echo "Disparando redeploy en Portainer…"
          http_code=$(curl -fsSL -o /tmp/response.txt -w "%{http_code}" -X POST "${PORTAINER_WEBHOOK_URL}" || true)
          echo "HTTP ${http_code}"
          cat /tmp/response.txt || true

          if [ "${http_code}" -ge 400 ]; then
            echo "::error::Webhook Portainer respondió ${http_code}"
            exit 1
          fi

          echo "Redeploy disparado correctamente."
