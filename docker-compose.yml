# Stack de producción para gesdiweb (Hetzner)
#
# Astro corre como servidor Node standalone en el puerto 4321 (interno).
# Nginx Proxy Manager lo expone con SSL en gesdiweb.es / www.gesdiweb.es.
#
# Variables de entorno (definir en .env del host o en Portainer):
#   RESEND_API_KEY              clave de Resend
#   RESEND_FROM_EMAIL           default hola@gesdiweb.es
#   LEAD_NOTIFICATION_EMAIL     dónde llegan los leads
#
# Despliegue local (test del contenedor de producción):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: ghcr.io/dignitasjota/gesdiweb-web:latest
    container_name: gesdiweb_web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4321
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-hola@gesdiweb.es}
      LEAD_NOTIFICATION_EMAIL: ${LEAD_NOTIFICATION_EMAIL:-hola@gesdiweb.es}
    networks:
      - proxy
    labels:
      - "com.gesdiweb.service=web"
      - "com.gesdiweb.role=frontend-and-api"

networks:
  proxy:
    # En el VPS Hetzner esta red la creará Nginx Proxy Manager.
    external: true
    name: npm_default
